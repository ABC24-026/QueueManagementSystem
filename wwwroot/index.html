<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesigo Queue - Join</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Sesigo Queue</h1>
            <p class="subtitle">Join the queue and get notified by SMS</p>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="26771234567" maxlength="12">
            </div>

            <div class="form-group">
                <label>Service Type</label>
                <select id="serviceType">
                    <option value="Bank">Bank</option>
                    <option value="Clinic">Clinic</option>
                    <option value="Government office">Government Office</option>
                    <option value="Retail">Retail</option>
                </select>
            </div>

            <button onclick="joinQueue()" class="btn-primary">Join Queue</button>

            <div id="result" class="result hidden"></div>
        </div>
    </div>

    <script src="js/customer.js"></script>
</body>
</html>
